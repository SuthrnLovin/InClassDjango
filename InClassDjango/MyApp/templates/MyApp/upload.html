<!DOCTYPE html>
<html>
<head>
    <title>Upload Audio</title>
</head>

<body>

    <h1>Upload MP3</h1>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Upload</button>
    </form>
    {% if form.instance.audio %}
    <audio controls>
        <source src="{{ form.instance.audio.url }}" type="audio/mpeg">
    </audio>
    {% endif %}

</body>
</html>
